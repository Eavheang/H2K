[package]
name = "h2k"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3"
gpui = "0.2.2"
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }

[patch.crates-io]
# Local gpui 0.2.2 that keeps running after the last window closes (close-to-tray).
# See vendor/gpui/PATCHED.md.
gpui = { path = "vendor/gpui" }
